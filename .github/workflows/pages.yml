# GitHub Pages: the PWA with sample data (mock API, no server).
# Demo data is committed (apps/web/demo/data.json); regenerate with `node apps/web/demo/snapshot.mjs`.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build --mode demo
        working-directory: apps/web
      - run: mkdir -p apps/web/demo/dist/api && cp apps/web/demo/export.xlsx apps/web/demo/dist/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
