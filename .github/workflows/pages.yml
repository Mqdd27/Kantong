# GitHub Pages: README + docs/ as the docs site (Jekyll), the PWA with sample data at /demo/.
# Demo data is committed (apps/web/demo/data.json); regenerate with `node apps/web/demo/snapshot.mjs`.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build --mode demo
        working-directory: apps/web
      - name: Assemble site
        run: |
          mkdir -p site/demo/api
          cp -r apps/web/demo/dist/. site/demo/
          cp apps/web/demo/export.xlsx site/demo/api/
          cp -r docs site/docs
          cp README.md .github/pages/_config.yml site/
          # links into code folders only exist on GitHub, not on the site
          sed -i -E 's#\]\((\.\./)?(hermes|apps)(/[^)]*)?\)#](https://github.com/${{ github.repository }}/tree/main/\2\3)#g' site/README.md site/docs/*.md
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
